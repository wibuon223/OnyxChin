services:
  - type: web
    name: donghive-relay
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    autoDeployTrigger: commit
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
